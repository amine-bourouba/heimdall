name: CI

# Task M1-58 (the `rust` job); M2-29 adds `frontend`, `e2e-mocked` and `e2e-real-app-smoke`. Runs
# on every push and pull request — this is the day-to-day gate for the whole repo: Rust
# formatting/lints/tests/supply-chain checks, the
# generated-bindings and DTO-fixture drift checks, the heimdall-core coverage gate, frontend
# lint/typecheck/coverage/audit/security-lint/bundle-size, and both halves of the Playwright and
# real-app E2E suites (e2e/README.md).

on:
  push:
    branches: [main]
  pull_request:
  # M1-59 (the M1 gate review) needs a real, per-OS CI run as evidence before feature/m1-data-core
  # has ever been merged into main or opened as a PR — manual dispatch gets that without either.
  workflow_dispatch:
    inputs:
      # One-off escape hatch for regenerating the committed Linux visual baselines (P-13: never
      # generated locally, never committed unreviewed) after a UI change shifts pixels on purpose.
      # Default false means every normal dispatch behaves exactly as before.
      update_visual_snapshots:
        description: 'Regenerate the visual projects baselines (uploads them as an artifact for review, does not commit)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tauri's own build needs these to compile at all on Linux; xvfb provides the X11 display
      # webkit2gtk needs even for `cargo test`, not only a real windowed run.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev xvfb

      # rust-toolchain.toml pins the channel (1.98.1) and components (clippy, rustfmt) with no
      # target override, so rustup on each runner installs that channel for its own default host
      # triple automatically (msvc on Windows, gnu on Linux, the standard Apple triple on macOS) —
      # no explicit toolchain-setup action needed.
      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --workspace
        run: cargo clippy --workspace -- -D warnings

      # --no-fail-fast: without it, cargo test stops the whole invocation at the first broken
      # test *target*, which on windows-latest means heimdall_desktop_lib's own crash (M1-59's
      # gate review) silently prevented tests/watcher.rs from ever running at all, three runs in
      # a row, with no sign of it in the log beyond "there is no Running tests\watcher.rs line."
      - name: cargo test --workspace (Linux, under xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum cargo test --workspace --no-fail-fast

      - name: cargo test --workspace
        if: runner.os != 'Linux'
        run: cargo test --workspace --no-fail-fast

      # ADR 0002: heimdall-core must never depend on tauri, checked directly rather than trusted.
      - name: heimdall-core must never depend on tauri (ADR 0002)
        if: runner.os == 'Linux'
        run: |
          if cargo tree -p heimdall-core | grep -qi tauri; then
            echo "::error::heimdall-core depends on tauri — ADR 0002 says it never should"
            cargo tree -p heimdall-core
            exit 1
          fi

      - name: cargo deny check
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

      - name: Setup Node
        if: runner.os == 'Linux'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        if: runner.os == 'Linux'
        run: npm ci

      # M1-37 / ADR 0004: CI regenerates the TypeScript bindings and fails if they differ from
      # what's committed, so a Rust-side command signature change can never silently drift from
      # src/ipc/bindings.ts.
      - name: Check generated bindings are up to date
        if: runner.os == 'Linux'
        run: node scripts/check-bindings.mjs

      # M2-29: fixtures/dto/README's own documented plan ("A drift check in CI (M2-29) fails if
      # the committed copy and a fresh regeneration differ"). Needs cargo, same as the bindings
      # check above, so it lives here rather than in the Node-only `frontend` job.
      - name: Check fixtures/dto/ is up to date
        if: runner.os == 'Linux'
        run: |
          cargo run --quiet -p heimdall-core --example export_dto_fixtures
          if ! git diff --exit-code -- fixtures/dto/; then
            echo "::error::fixtures/dto/ is out of date — regenerate it locally (cargo run -p heimdall-core --example export_dto_fixtures) and commit the result."
            exit 1
          fi

      # M1-56: heimdall-core line coverage gate. Only runs on Linux — the same
      # profiler_builtins gap documented in that task's own progress-log entry means this can't
      # run on windows-gnu, and there is no reason to run the same gate three times regardless.
      - name: heimdall-core coverage gate
        if: runner.os == 'Linux'
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked
          bash scripts/coverage-core.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci

      - name: npm run lint
        run: npm run lint

      - name: npm run typecheck
        run: npm run typecheck

      - name: npm run test:coverage
        run: npm run test:coverage

      - name: npm audit --audit-level=high
        run: npm audit --audit-level=high

      # M2-27.
      - name: Security configuration lint
        run: node scripts/lint-security-config.mjs

      # Needed before the bundle-size check below can read dist/.vite/manifest.json.
      - name: npm run build
        run: npm run build

      # M2-28.
      - name: Bundle size budgets
        run: node scripts/check-bundle-size.mjs

  e2e-mocked:
    name: E2E (mocked, Playwright)
    needs: frontend
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci

      # `--with-deps` installs both browser binaries and the OS packages they need; xvfb itself
      # (a virtual display, not a browser dependency) is separate -- Playwright's own WebKit on
      # Linux is documented to need a real X display for some operations even when run
      # "headless", the same reason the `rust` job already wraps `cargo test` in `xvfb-run`.
      - name: Install Playwright browsers and system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          npx playwright install --with-deps chromium webkit

      # chromium/webkit (M2-23 AC1), visual (M2-24 AC1/AC2 -- committed Linux baselines live here,
      # P-13), security (M2-26 AC2), perf (M2-28 AC1). `visual` fails until this job's own first
      # real run produces baselines for a human to review and commit -- documented in
      # e2e/visual/session.spec.ts's own progress-log entry, not something this workflow commits
      # on its own. `update_visual_snapshots` runs only the visual project, with
      # `--update-snapshots`, instead -- the normal command's own five-project run would otherwise
      # overwrite baselines as a side effect of chromium/webkit/security/perf passing too.
      - name: Playwright (all mocked projects)
        if: ${{ !inputs.update_visual_snapshots }}
        run: xvfb-run --auto-servernum npx playwright test --project=chromium --project=webkit --project=visual --project=security --project=perf

      - name: Playwright (regenerate visual baselines)
        if: ${{ inputs.update_visual_snapshots }}
        run: xvfb-run --auto-servernum npx playwright test --project=visual --update-snapshots

      - name: Upload Playwright report and test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore

      # `--update-snapshots` overwrites the baseline PNGs in place under e2e/visual/ -- nothing in
      # CI commits them (P-13: a human reviews a real Linux render first), so they only reach
      # anyone at all via this artifact. A glob, not one hardcoded spec's own `-snapshots/`
      # directory (M3-18, a necessary ripple: `mvp-screens.spec.ts` is a second visual spec file
      # since M3-10 first wrote this step for `session.spec.ts` alone -- the old hardcoded path
      # would have silently dropped its baselines from the artifact).
      - name: Upload regenerated visual baselines
        if: ${{ inputs.update_visual_snapshots }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baselines-updated
          path: e2e/visual/*.spec.ts-snapshots/
          retention-days: 14

  e2e-real-app-smoke:
    name: E2E real-app smoke (${{ matrix.os }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # webkit2gtk-driver provides WebKitWebDriver, the binary tauri-driver (below) proxies
      # WebDriver commands to -- libwebkit2gtk-4.1-dev alone does not include it, confirmed
      # directly by a real run failing with "can not find binary WebKitWebDriver in the PATH".
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev webkit2gtk-driver libayatana-appindicator3-dev librsvg2-dev xvfb

      # The Linux job above gets its WebView-equivalent (webkit2gtk) from apt; Windows needs its
      # own equivalent check. windows-latest is Windows Server, not Windows 11 client -- the
      # "WebView2 Runtime ships as part of the OS" guarantee Microsoft documents is for Windows 11
      # client only, and confirmed directly: a real run here spawned heimdall-desktop.exe
      # successfully (no Node spawn/exit error) but it then produced zero output and never opened
      # the CDP debugging port within 60s, the signature of CoreWebView2Environment creation never
      # resolving rather than a fast crash. choco is already on this exact runner image (GitHub's
      # own documented software list), so this reuses it instead of hand-rolling a bootstrapper
      # download.
      - name: Install WebView2 Runtime (Windows)
        if: runner.os == 'Windows'
        run: choco install webview2-runtime -y --no-progress

      - name: Rust cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: npm ci
        run: npm ci

      # tauri-build's own build.rs (src-tauri/build.rs) embeds whatever already exists under
      # dist/ -- this has to run before building the app, not after.
      - name: npm run build
        run: npm run build

      # Not a plain `cargo build -p heimdall-desktop`: confirmed directly (a real, fresh binary,
      # both debug and release profile) that a bare `cargo build` always produces a binary that
      # tries Vite's dev server at localhost:1420 and gets ERR_CONNECTION_REFUSED, never the
      # bundled dist/ assets npm run build above just produced -- this is not a debug-vs-release
      # distinction at all (an earlier version of this comment guessed `--release` would fix it;
      # it does not). The `tauri` CLI's own `build` command is what correctly wires frontendDist
      # instead of devUrl; `--debug` keeps it an unoptimized debug build (fast, and the one both
      # e2e/support/tauriCdp.ts and e2e/smoke/wdio.conf.mjs already expect at target/debug/) and
      # `--no-bundle` skips installer/package creation real-app smoke has no use for. Still lands
      # at target/debug/heimdall-desktop[.exe] (M2-29: both scripts previously hard-coded
      # src-tauri/target/debug/ instead, which never existed at all -- src-tauri is a cargo
      # workspace *member*, so every build lands in the shared workspace target/).
      - name: tauri build --debug --no-bundle
        run: npx tauri build --debug --no-bundle

      - name: Linux real-app smoke (tauri-driver)
        if: runner.os == 'Linux'
        run: |
          cargo install tauri-driver
          xvfb-run --auto-servernum npm run test:e2e:linux-smoke

      - name: Windows real-app smoke (CDP)
        if: runner.os == 'Windows'
        run: npm run test:e2e:windows-smoke
