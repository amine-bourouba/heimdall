[package]
name = "heimdall-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Parsing and domain logic for Heimdall. Must never depend on tauri (ADR 0002)."

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
specta.workspace = true
dirs = "7.0.0"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
regex = "1.13.1"
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.27.0"
